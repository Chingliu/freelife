# 更进一步：构建"交易知识库"

真正厉害的不是 Prompt，而是**让 AI 自己总结交易规则**。

例如，每分析一只股票，都追加一个任务：

```
阅读刚才全部分析。

请总结：

今天新增了哪些交易经验？

哪些规则值得加入交易系统？

输出：

Rule001

Rule002

Rule003

......

如果已有规则冲突，

请指出。
```

例如：

```
新增：

Rule073

连续缩量以后第一次放量突破，

成功率高。

新增：

Rule074

MACD金叉必须配合成交量。

否则容易失败。
```

半年以后：

```
Rule001

...

Rule327

...
```

这就形成了属于你自己的交易知识库。

---

# 最后，我建议升级为"交易导师（Trading Mentor）"模式

与其问 AI：

> **"这只股票能买吗？"**

不如要求 AI 每次都回答固定的 10 个问题：

1. 当前市场属于什么阶段（牛市、熊市、震荡）？
2. 当前股票处于什么趋势？
3. 多头最强的证据是什么？
4. 空头最强的证据是什么？
5. 当前最大的风险是什么？
6. 当前最大的机会是什么？
7. 如果今天必须买，为什么？
8. 如果今天绝对不能买，为什么？
9. 买入后，什么条件出现必须卖？
10. 请将本次分析提炼成新的交易系统规则（RuleXXX）。

