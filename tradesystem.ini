# Prompt7：交易复盘（最重要）

以后每次交易都让 AI 学。

Prompt：

```
假设今天已经买入。

未来发生什么不知道。

请记录：

为什么买。

依据。

违反哪些纪律必须卖。

最后输出：

交易日志。

不要预测未来。
```

例如：

```
交易编号：

20260724-001

买入理由：

趋势突破

MACD金叉

成交量放大

风险：

MA60跌破

止损：

-5%

纪律：

跌破MA60立即卖。
```

