我觉得你已经走到了**真正有价值的一步**。

大部分人都是让 AI 预测股票，而你的思路是：

> **让 AI 成为交易系统研究员（Researcher），而不是荐股大师。**

这是两件完全不同的事情。

---

## 我建议你不要设计成一个Prompt，而是设计成一套 Prompt Framework（提示框架）

以后 Cursor Rules 固定下来以后，每分析一只股票，都遵循同样的分析流程。

例如：

```
读取行情
        │
        ▼
判断趋势
        │
        ▼
判断主力行为
        │
        ▼
判断风险收益
        │
        ▼
制定交易计划
        │
        ▼
验证交易系统
        │
        ▼
输出交易日志
```

这实际上就是你的 AI 交易系统。

---

# 我建议拆成 7 个 Prompt

而不是一个 Prompt。

最后 Cursor 自动串起来。

---

# Prompt1：趋势分析器（Trend Analyzer）

输入：

```
这是某股票最近250日行情数据。

请不要预测。

请只回答：

1、长期趋势
2、中期趋势
3、短期趋势
4、目前属于上涨、震荡还是下跌
5、为什么

请引用：

MA20
MA60
MA120
MA250

MACD

成交量

不要使用任何未来数据。
```

输出例如：

```
长期：

MA250向上

中期：

MA60拐头

短期：

MA20跌破MA60

趋势：

震荡偏弱

依据：

MACD死叉
成交量缩小
```

---

# Prompt2：资金行为分析器

```
分析资金行为。

回答：

是否有主力吸筹

是否有洗盘

是否有出货

为什么。

引用：

成交量

换手率

OBV

成交量均线

不要预测。

不要使用未来数据。
```

---

# Prompt3：买点分析器（最重要）

这是以后交易系统的核心。

Prompt：

```
你是一位严格执行交易系统的基金经理。

不要猜测。

请根据数据回答：

目前是否属于：

A类买点

B类买点

C类买点

如果不是，

距离买点还差什么条件。

每个条件必须写出来。

例如：

MA20站上MA60

MACD金叉

成交量放大

突破平台

RSI>50

等等。
```

输出：

```
不是买点。

距离买点：

① MA20重新站上MA60

② 成交量连续3日放大

③ MACD红柱扩大

满足以上条件以后再考虑。
```

这就是以后可以直接自动提醒。

---

# Prompt4：卖点分析器

```
请分析目前是否属于卖点。

如果是，

属于：

止盈

止损

减仓

全部卖出

为什么。

引用：

ATR

MACD

成交量

均线

趋势

不要预测。
```

输出：

```
建议：

减仓30%

原因：

放量滞涨

MACD顶背离

ATR扩大

风险增加。
```

---

# Prompt5：交易系统构建器（最重要）

这一段以后会越来越大。

Prompt：

```
请不要评价股票。

请反向总结：

如果这是一套成熟交易系统。

它为什么现在可以买？

为什么现在不能买？

请把所有条件总结成：

IF

THEN

格式。

例如：

IF

MA20>MA60

AND

MACD金叉

AND

成交量放大

THEN

可以买。

否则等待。

请最后总结成可以写进程序里的规则。
```

输出：

```
Rule001

IF

MA20>MA60

AND

MACD DIF>DEA

AND

VOL>VOL5

THEN BUY
```

这就是以后 Cursor 可以直接生成 C++ 或 Python 代码。

